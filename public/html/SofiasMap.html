<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodHubBC – Map</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Mapbox -->
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v3.23.1/mapbox-gl.css"
      rel="stylesheet"
    />
    <script
      defer
      src="https://api.mapbox.com/mapbox-gl-js/v3.23.1/mapbox-gl.js"
    ></script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Darker Grotesque", sans-serif;
        display: flex;
        justify-content: center;
        background: linear-gradient(
          185deg,
          #6fae9854 0%,
          #87dab6b4 28%,
          #8bdaba59 55%,
          #6eb19786 78%,
          #6ab89ec2 100%
        );
        color: #0f2a1f;
      }

      .page {
        width: 100%;
        max-width: 430px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #a5ffe549;
      }

      .header {
        padding: 0.5rem 0.5rem 0.5rem;
        letter-spacing: 1px;
        font-weight: 600;
        background: white;
        text-align: center;
        font-size: 1.25rem;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        letter-spacing: 0.03em;
      }

      .mapBox {
        height: 55vh;
        min-height: 260px;
        background: #d9e8df;
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }

      .mapBox::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.12);
        pointer-events: none;
      }

      #map {
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 1;
      }

      #map-overlay {
        position: absolute;
        top: 0;
        bottom: 0;
        right: 0;
        left: 0;
        background: rgba(0, 0, 0, 0.55);
        pointer-events: none;
        z-index: 2;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
      }

      .controls {
        animation: boxSlidesIn 0.6s ease-out forwards;
        width: 100%;
        min-height: 33vh;
        display: flex;
        text-align: center;
        flex-direction: column;
        justify-content: flex-start;
        margin-top: -1rem;
        background: rgba(255, 255, 255, 0.075);
        backdrop-filter: blur(13px);
        border-radius: 2rem 2rem 0 0;
        padding: 1.8rem 1.4rem 2.4rem;
        color: #0f2a1f;
      }

      @keyframes boxSlidesIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .controls h2 {
        margin: 0 0 0.8rem;
        font-size: 1.65rem;
        font-weight: 650;
        letter-spacing: 0.03em;
      }

      .boxRegionSelector {
        margin-bottom: 0.8rem;
        width: 100%;
        margin-bottom: 1rem;
        text-align: left;
      }

      .boxRegionSelector label {
        font-size: 1.3rem;
        margin-bottom: 0.4rem;
        text-align: center;
        font-weight: 600;
        display: block;
        margin-bottom: 0.3rem;
      }

      .boxRegionSelector select {
        box-shadow:
          0 0 8px rgba(255, 255, 255, 0.7),
          0 0 14px rgba(255, 255, 255, 0.45);
        border: 2px solid rgba(255, 255, 255, 0.6);
        width: 60%;
        max-width: 60%;
        margin: 0 auto;
        display: block;
        font-size: 1.2rem;
        padding: 0.6rem 0.8rem;
        border-radius: 999px;
        background-color: rgba(255, 255, 255, 0.308);
        font-family: "Darker Grotesque";
        outline: none;
      }

      /* modifies size, width, and padding of options in dropdown menu */
      .boxRegionSelector select:focus {
        width: 60%;
        max-width: 60%;
        margin: 0 auto;
      }

      .boxRegionSelector select option {
        padding: 0.25rem 0.6rem;
        font-size: 0.9rem;
      }

      #selectRegion {
        font-size: 1.5rem;
      }

      /* select distance text */
      #selectDistance {
        font-size: 1.5rem;
        letter-spacing: 0;
        margin-top: 5px;
        margin-bottom: 0px;
      }

      .sliderSection {
        margin-top: 1px;
        position: relative;
        justify-content: space-between;
        flex-direction: column;
        width: 100%;
        display: flex;
        align-items: center;
        margin-bottom: 0.8rem;
      }

      .sliderValueKm {
        position: absolute;
        right: 0;
        top: -1.4rem;
        font-size: 1.4rem;
        font-weight: 650;
      }

      .slider {
        width: 100%;
      }

      #radius-slider {
        width: 100%;
      }

      input[type="range"] {
        margin-top: 10px;
        width: 100%;
        accent-color: #2d5f4a;
        cursor: pointer;
      }

      .useLocation {
        justify-content: center;
        align-items: center;
        gap: 0.5rem; /* gap between plane icon and button*/
        display: flex;
        margin: 0.05rem 0 1.8rem;
        font-size: 1.45rem;
        font-weight: 600;
      }

      .useLocation img {
        width: 22px;
        height: 22px;
        object-fit: contain;
      }

      .chooseButton {
        font-family: "Darker Grotesque";
        font-size: 1.2rem;
        font-weight: 500;
        margin-top: -25px;
        letter-spacing: 0.03em;
        padding: 0.8rem;
        width: 200px;
        margin: 0 auto;
        background: #0f2a1f;
        color: white;
        border: none;
        border-radius: 999px;
        transition: 0.4s ease;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }

      .chooseButton:active {
        box-shadow: 0 0 18px rgba(255, 74, 134, 0.507);
        background: #0f2a1f;
        transform: scale(0.98);
      }

      .useLocation:active {
        text-shadow: 0 0 12px rgba(255, 74, 135, 0.75);
        transform: scale(0.97);
      }

      /* hiding unused elements */
      #instructions,
      .info-card,
      #status {
        display: none;
      }

      @media (min-width: 700px) {
        .page {
          max-width: 100%;
        }
      }

      @media (min-width: 1100px) {
        body {
          justify-content: flex-start;
          background: linear-gradient(
            185deg,
            #6fae9854 0%,
            #87dab6b4 28%,
            #8bdaba59 55%,
            #6eb19786 78%,
            #6ab89ec2 100%
          );
        }

        .page {
          width: 100%;
          margin: 0;
          overflow: hidden;
          max-width: 100%;
        }

        .header {
          font-size: 1.6rem;
          padding: 1rem;
        }

        .mapBox {
          height: 60vh;
          border-radius: 0;
        }

        .controls {
          max-width: 100%;
          width: 100%;
          border-radius: 0;
          padding: 2rem 3rem 3rem;
          display: flex;
          flex-direction: column;
          align-items: center;
        }

        .boxRegionSelector select {
          max-width: 400px;
          width: 40%;
        }

        .slider {
          width: 60%;
          max-width: 600px;
        }

        .chooseButton {
          width: 260px;
        }

        .sliderSection {
          position: relative;
          width: 80%;
          max-width: 600px;
        }

        .sliderValueKm {
          margin-right: 100px;
          top: -1.4rem;
        }
      }
    </style>
  </head>

  <body>
    <main class="page">
      <div class="header">Choose a location to see what's available!</div>

      <div class="mapBox">
        <div id="map"></div>
        <div id="map-overlay"></div>

        <!-- kept from original code, but hidden -->
        <div id="instructions"></div>
        <div id="info-card" class="info-card"></div>
        <p id="status"></p>
      </div>

      <section class="controls">
        <div class="boxRegionSelector">
          <label for="regionSelector" id="selectRegion">Select a Region</label>
          <select id="regionSelector">
            <option value="">– Choose a region –</option>
            <option value="downtownVancouver">Downtown Vancouver</option>
            <option value="burnaby">Burnaby</option>
            <option value="newWest">New West</option>
            <option value="richmond">Richmond</option>
            <option value="coquitlam">Coquitlam</option>
          </select>
        </div>

        <h2 id="selectDistance">Select your Distance</h2>

        <div class="sliderSection">
          <span class="sliderValueKm"
            ><span id="radius-value">10</span> km</span
          >
          <div class="slider">
            <input
              id="radius-slider"
              type="range"
              min="1"
              max="10"
              value="10"
              step="1"
            />
          </div>
        </div>

        <div class="useLocation" id="use-current-location-btn">
          <img src="/img/PlaneIcon.png" alt="" />
          <span>Use my current location</span>
        </div>

        <button class="chooseButton" id="set-location-btn">
          Choose this location
        </button>
      </section>
    </main>
    <script type="module">
      /**
       * CREDITS
       *
       * Anas: Wrote 90% of the map logic.
       * Sofia: Modified 10% of the code to implement the radius feature,
       *        removed references to local storage, wrote comments.
       */
      const mapboxgl = window.mapboxgl;

      // Fetches the mapbox token
      const tokenRes = await fetch("/api/mapbox-token");
      const tokenParsed = await tokenRes.json();
      mapboxgl.accessToken = tokenParsed.token;

      let map;
      let userLocation;
      let selectedLocation = null;
      let userMarker = null;
      let locationMarkers = [];

      // The default radius
      let radius = 5;
      const slider = document.getElementById("radius-slider");
      const radiusLabel = document.getElementById("radius-value");
      const regionSelect = document.getElementById("regionSelector");

      // List of locations within radius
      let currentFilteredLocations = [];

      // Coordinates to represent each region (Sofia)
      const CENTER_OF_REGION = {
        downtownVancouver: [-123.1207, 49.2827],
        burnaby: [-122.9693, 49.2488],
        newWest: [-122.9109, 49.2057],
        richmond: [-123.136, 49.1666],
        coquitlam: [-122.7932, 49.2838],
      };

      await initializeMap();

      async function initializeMap() {
        // Gets user's saved location
        userLocation = await getUserLocation();

        map = new mapboxgl.Map({
          container: "map",
          style: "mapbox://styles/mapbox/streets-v12",
          center: userLocation,
          zoom: 13,
        });

        map.addControl(new mapboxgl.NavigationControl());

        map.once("load", async () => {
          // Places the user's marker on the map
          userMarker = createUserMarker(userLocation);

          setupMapClickHandler();
          setupSetLocationButton();
          setupCurrentLocationButton();

          // Adds the gray radius overlay
          updateMapMask(radius);

          // Keeps overlay the same, even upon zooming or moving the map
          map.on("move", () => updateMapMask(radius));
          map.on("zoom", () => updateMapMask(radius));

          // Sets up the dropdown menu
          setupRegionSelect();
        });
      }

      /**
       * Calculates the distance in kilometers between two coordinates.
       *
       * Uses the Haversine formula.
       *
       * @returns distance in kilometers
       */
      function getDistanceKm(a, b) {
        const R = 6371;

        const dLat = ((b[1] - a[1]) * Math.PI) / 180;
        const dLon = ((b[0] - a[0]) * Math.PI) / 180;

        const lat1 = (a[1] * Math.PI) / 180;
        const lat2 = (b[1] * Math.PI) / 180;

        const x =
          Math.sin(dLat / 2) ** 2 +
          Math.sin(dLon / 2) ** 2 * Math.cos(lat1) * Math.cos(lat2);

        return R * (2 * Math.asin(Math.sqrt(x)));
      }

      /**
       * Checks if a point is within a given radius.
       */
      function isWithinRadius(userLoc, pointLoc, radiusKm) {
        return getDistanceKm(userLoc, pointLoc) <= radiusKm;
      }

      /**
       * Updates the gray radius overlay.
       */
      function updateMapMask(radiusKm) {
        if (!map) return;

        const center = map.getCenter();
        const zoom = map.getZoom();

        // Converts km to px based on the current zoom level
        const mpp =
          (40075016.686 * Math.cos((center.lat * Math.PI) / 180)) /
          Math.pow(2, zoom + 8);

        const radiusMeters = radiusKm * 1000;
        let radiusPx = radiusMeters / mpp;

        // Tries to prevent the overlay from extending past the width/height of the map
        const rect = map.getCanvas().getBoundingClientRect();
        const maxRadius = Math.sqrt(rect.width ** 2 + rect.height ** 2) / 2;
        radiusPx = Math.min(radiusPx, maxRadius - 20);

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        // The CSS overlay
        const mask = `radial-gradient(
        circle ${radiusPx}px at ${centerX}px ${centerY}px,
        transparent 0 ${radiusPx}px,
        black ${radiusPx}px 100%
        )`;

        const overlay = document.getElementById("map-overlay");
        overlay.style.webkitMaskImage = mask;
        overlay.style.maskImage = mask;
      }

      /**
       * Creates the marker representing the user's location.
       */
      function createUserMarker(location) {
        return new mapboxgl.Marker({ color: "green" })
          .setLngLat(location)
          .addTo(map);
      }

      async function saveLocationToDB(location, radius, region = null) {
        const locationData = {
          selectedlocation: location,
          selectedradius: radius,
        };

        try {
          await fetch("/api/saveuserlocation", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(locationData),
          });
        } catch (err) {
          console.error("There was a problem saving the location: ", err);
        }
      }

      // Taken from Anas, slightly modified
      function setupMapClickHandler() {
        map.on("click", (event) => {
          selectedLocation = [event.lngLat.lng, event.lngLat.lat];
          userLocation = selectedLocation;

          if (userMarker) {
            userMarker.setLngLat(userLocation);
          } else {
            userMarker = createUserMarker(userLocation);
          }

          map.flyTo({
            center: userLocation,
            zoom: 15,
          });

          const settings =
            JSON.parse(localStorage.getItem("userSettings")) || {};
          settings.location = userLocation;
          localStorage.setItem("userSettings", JSON.stringify(settings));

          loadLocations();
          updateMapMask(radius);
        });
      }

      // Taken from Anas
      function setupSetLocationButton() {
        const button = document.getElementById("set-location-btn");
        if (!button) return;

        button.addEventListener("click", handleSetLocation);
      }

      function handleSetLocation() {
        console.log("Choose location clicked");
        console.log("userLocation is:", userLocation);

        if (!userLocation) {
          console.log("No userLocation — cannot save");
          return;
        }

        // Save to DB
        saveLocationToDB(userLocation, radius);

        // Save to localStorage (optional)
        const settings = JSON.parse(localStorage.getItem("userSettings")) || {};
        settings.location = userLocation;
        settings.radius = radius;
        localStorage.setItem("userSettings", JSON.stringify(settings));

        // Redirect AFTER saving
        window.location.href = "/html/Home.html";
      }

      async function getUserLocation() {
        const defaultLocation = [-123.0016, 49.2532];

        if (!navigator.geolocation) return defaultLocation;

        return new Promise((resolve) => {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              resolve([pos.coords.longitude, pos.coords.latitude]);
            },
            () => resolve(defaultLocation),
          );
        });
      }

      // Taken from Anas, slightly modified
      async function loadLocations() {
        try {
          const res = await fetch("../resource/locations.JSON");
          const locations = await res.json();

          const arr = Array.isArray(locations) ? locations : [locations];
          renderLocations(arr);
        } catch (err) {
          console.error("There was an error loading the JSON file: ", err);
        }
      }

      // Taken from Anas
      function renderLocations(locations) {
        currentFilteredLocations = [];

        for (const loc of locations) {
          const coords = loc?.geo?.coordinates;
          if (!coords) continue;
          if (!userLocation) continue;

          if (!isWithinRadius(userLocation, coords, radius)) continue;

          currentFilteredLocations.push(loc);
        }

        console.log(
          "Filtered locations within radius:",
          currentFilteredLocations,
        );
      }

      // Taken from Anas, modified for the slider & zoom effect
      slider?.addEventListener("input", () => {
        radius = Number(slider.value);
        if (radiusLabel) radiusLabel.textContent = radius;

        const settings = JSON.parse(localStorage.getItem("userSettings")) || {};
        settings.radius = radius;
        localStorage.setItem("userSettings", JSON.stringify(settings));

        updateMapMask(radius);
        loadLocations();

        const zoom = 14 - radius * 0.25;
        map.easeTo({ zoom, duration: 400 });
      });

      // Taken from Anas, slightly modified
      function setupCurrentLocationButton() {
        const button = document.getElementById("use-current-location-btn");
        if (!button) return;

        button.addEventListener("click", setUserPinToCurrentLocation);
      }

      async function setUserPinToCurrentLocation() {
        const currentLocation = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              resolve([pos.coords.longitude, pos.coords.latitude]);
            },
            reject,
            {
              enableHighAccuracy: false,
              timeout: 20000,
              maximumAge: 60000,
            },
          );
        });

        userLocation = currentLocation;

        if (userMarker) {
          userMarker.setLngLat(userLocation);
        } else {
          userMarker = createUserMarker(userLocation);
        }

        map.flyTo({
          center: userLocation,
          zoom: 15,
        });

        const settings = JSON.parse(localStorage.getItem("userSettings")) || {};
        settings.location = userLocation;
        localStorage.setItem("userSettings", JSON.stringify(settings));

        await loadLocations();
        updateMapMask(radius);
      }

      // New code, not taken from Anas; for the dropdown regions
      function setupRegionSelect() {
        if (!regionSelect) return;

        regionSelect.addEventListener("change", () => {
          const value = regionSelect.value;
          if (!value || !CENTER_OF_REGION[value]) return;

          const center = CENTER_OF_REGION[value];
          userLocation = center;

          if (userMarker) {
            userMarker.setLngLat(userLocation);
          } else {
            userMarker = createUserMarker(userLocation);
          }

          map.flyTo({
            center: userLocation,
            zoom: 13,
          });

          const settings =
            JSON.parse(localStorage.getItem("userSettings")) || {};
          settings.location = userLocation;
          localStorage.setItem("userSettings", JSON.stringify(settings));

          loadLocations();
          updateMapMask(radius);
        });
      }
    </script>
  </body>
</html>
