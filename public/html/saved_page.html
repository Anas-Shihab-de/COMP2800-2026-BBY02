<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Darker Grotesque" rel="stylesheet" />
  <!-- Google Fonts-->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <!-- CSS -->
  <link rel="stylesheet" href="../css/saved_page.css" />
  <title>Saved Places</title>
</head>

<body class="saved-page">
  <header class="header">
    <button type="button" class="header__back-btn backButton">
      <span class="material-symbols-outlined"> arrow_back_ios </span>
    </button>
    <h1 class="header__title headerText">Saved Places</h1>

    <div class="headerButtons">
      <button type="button" class="header__btn">Explore All</button>

      <button type="button" class="header__filter-btn filterButton" id="filter-btn">
        <span class="material-symbols-outlined material-symbols-outlined-filter">
          filter_list
        </span>
      </button>
    </div>
  </header>

  <main>
    <!-- Cards -->
    <section class="locationsGrid section__saved-page" id="section__saved-page">
    </section>
  </main>


  <!-- FILTER PANEL -->
  <div id="filterPanelBg" class="filterPanelBg hidden"></div>
  <div id="filterPanel" class="filterPanel hidden">
    <div class="filter-header">
      <h2>Filter Tags</h2>
    </div>

    <div class="filter-section">
      <p class="filter-label">Sort By</p>
      <select id="sort-select" class="sort-select">
        <option value="distance">Nearest First</option>
        <option value="name">Name: A–Z</option>
      </select>
    </div>

    <div class="filter-section">
      <div id="filter-tags-container" class="filter-tags"></div>
    </div>

    <div class="filter-footer">
      <button class="clearButton" onclick="clearFilters()">Clear All</button>
      <button class="applyButton" onclick="applyFilters()">Apply</button>
    </div>
  </div>

</body>
<script src="../js/saved_page.js"></script>

</html>
