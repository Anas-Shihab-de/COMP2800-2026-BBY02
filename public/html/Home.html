<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodHubBC - Home</title>
    <link
      href="https://fonts.googleapis.com/css?family=Darker Grotesque"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Darker Grotesque";
        color: #10231b;
        justify-content: center;
        background: linear-gradient(
          185deg,
          #6fae98 0%,
          #4f7f6a 28%,
          #3b5c4f 55%,
          #2a443a 78%,
          #1e332c 100%
        );
      }

      .page {
        width: 100%;
        flex-direction: column;
        gap: 4vw;
        max-width: 1100px;
        padding: 4vw 5vw 8vw;
        display: flex;
      }

      /* For the Header */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 2rem;
      }

      .topBar {
        align-items: center;
        gap: 1rem;
        display: flex;
      }

      .fruitsLogo {
        width: 10vw;
        height: 10vw;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        min-width: 52px;
        min-height: 52px;
        max-width: 72px;
        max-height: 72px;
        border-radius: 50%;
        display: flex;
      }

      .fruitsLogo img {
        width: 60px;
        height: 60px;
        object-fit: contain;
      }

      .appName {
        font-family: "Darker Grotesque";
        white-space: nowrap;
        font-size: 2.1rem;
        letter-spacing: 0.04em;
        color: #ffffff;
        animation: cherryFade 0.9s ease forwards;
      }

      /* For the Individual Sections */
      .newSection {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .sectionHeader {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
        opacity: 0;
        animation: cherryFade 1.2s ease forwards;
        color: #fdfdfd;
      }

      .name {
        letter-spacing: 0.05em;
        font-size: 1.35rem;
        font-weight: 580;
        text-transform: uppercase;
      }

      .description {
        font-size: 1.2rem;
        opacity: 0.8;
      }

      .seeAll {
        font-size: 1.2rem;
        text-decoration: none;
        color: #ffffff;
        opacity: 0.9;
        border-bottom: 1px solid rgba(255, 255, 255, 0.4);
      }

      .rowOfLocations {
        padding: 1vw;
        display: flex;
        gap: 1rem;
        overflow-x: auto;
        padding-bottom: 0.4rem;
        scrollbar-width: none; /* removes the horizontal scrollbar */
      }

      .locationBox {
        flex: 0 0 55vw;
        min-width: 220px;
        max-width: 260px;
        opacity: 0;
        animation: cherryFade 1.4s ease forwards;
        border-radius: 1.6rem;
        background:
          linear-gradient(
            to bottom right,
            rgba(228, 255, 224, 0.699),
            transparent,
            rgba(255, 255, 255, 0.555)
          ),
          rgba(255, 255, 255, 0.12);
        transition:
          transform 1s ease,
          box-shadow 1s ease;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(255, 255, 255, 0.35);
        box-shadow: 0 5px 5px rgba(0, 0, 0, 0.35);
      }

      /* animation upon tapping the location */
      .locationBox:hover {
        transform: translateY(-0.6vw);
        box-shadow: 0px 9px 40px rgba(255, 74, 135, 0.6);
      }

      .locationImage {
        position: relative;
        width: 100%;
        padding-top: 75%;
        overflow: hidden;
      }

      .locationImage img {
        position: absolute;
        top: 0;
        bottom: 0;
        right: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .imageTag {
        position: absolute;
        left: 1rem;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        top: 1rem;
        padding: 0.35rem 0.9rem;
        font-size: 0.8rem;
      }

      .hubInfo {
        padding: 0.9rem 1rem 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
      }

      .locationName {
        margin-top: 0;
        margin-bottom: 0;
        color: white;
        font-size: 14.8pt; /* switched to pt bc I got tired of playing around with rem*/
        font-weight: 200;
      }

      .locationDetails {
        justify-content: space-between;
        align-items: center;
        display: flex;
      }

      .distanceInfo {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .locationIcon {
        width: 1.4rem;
        height: 1.4rem;
        border-radius: 80%;
        overflow: hidden;
        align-items: center;
        justify-content: center;
        border: none;
        background-color: rgba(255, 255, 255, 0.733);
      }

      .locationIcon img {
        object-fit: contain;
        width: 100%;
        height: 100%;
      }

      .relativePrice {
        font-size: 1.12rem;
        font-weight: 700;
        color: #0a3003;
      }

      .tagRow {
        display: flex;
        margin-top: 0.2rem;
        flex-wrap: wrap;
        gap: 0.35rem;
      }

      .tag {
        background: rgba(255, 255, 255, 0.438);
        font-size: 0.9rem;
        font-weight: 600;
        color: #1f3b32;
        padding: 0.25rem 0.7rem;
        border-radius: 999px;
      }

      .locationDistanceKm {
        font-size: 1.12rem;
        font-weight: 600;
        color: #0f241c;
      }

      /* For the Button Row + Settings Icon Directly Below the Header */
      .settingsIcon {
        width: 8vw;
        max-width: 38px;
        min-width: 20px;
        height: auto;
        margin-top: 1.2vw;
        animation: cherryFade 0.9s ease forwards;
        flex-shrink: 0; /* prevents the icon from forcing title onto second row*/
        opacity: 0.9;
      }

      .filterBar {
        display: flex;
        align-items: center;
        gap: 3vw;
        margin-top: 2vw;
        padding: 1vw 0;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .filterButton {
        box-shadow: 0 0 20px rgba(255, 105, 155, 0.678);
        background: black;
        color: white;
        font-size: 3.55vw;
        letter-spacing: 0.03em;
        font-family: "Darker Grotesque";
        border: none;
        padding: 0.5rem 1.1rem;
        border-radius: 999px;
        white-space: nowrap;
        font-weight: 500;
        animation: cherryFade 0.9s ease forwards;
        transition:
          box-shadow 0.8s ease,
          transform 0.8s ease;
      }

      /* The page transition upon loading in */
      @keyframes cherryFade {
        0% {
          opacity: 0;
          transform: translateY(2.5vw);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 800px) {
        .header {
          align-items: flex-start;
        }
      }

      @media (max-width: 540px) {
        .page {
          padding-inline: 5vw;
        }

        .sectionHeader {
          flex-direction: column;
          align-items: flex-start;
        }
      }

      @media (min-width: 700px) {
        .appName {
          font-size: 2.4rem;
        }

        .filterButton {
          font-size: 1.1rem;
          padding: 0.55rem 1.3rem;
        }

        .locationBox {
          flex: 0 0 32vw;
          min-width: 260px;
          max-width: 340px;
        }

        .locationName {
          font-size: 1.4rem;
        }

        .relativePrice,
        .locationDistanceKm {
          font-size: 1.3rem;
        }

        .tag {
          font-size: 1rem;
        }
      }

      /* Desktop media query */
      @media (min-width: 1100px) {
        * {
          box-sizing: content-box; /* necessary to prevent locations from clipping in the horizontal rows */
        }

        body {
          background: linear-gradient(
            185deg,
            #6fae98 0%,
            #4f7f6a 25%,
            #3b5c4f 50%,
            #2a443a 75%,
            #1f3a31 100%
          );
        }

        .page {
          max-width: 1300px; /* responsible for controlling width of each scrolling horizontal row */
          padding: 3vw 4vw 6vw;
        }

        .fruitsLogo {
          max-width: 95px;
          max-height: 95px;
        }

        .fruitsLogo img {
          width: 85px;
          height: 85px;
        }

        .header {
          padding-top: 1vw;
          margin-bottom: 0.5vw;
        }

        .appName {
          font-size: 3.4rem;
        }

        .name {
          font-size: 2rem;
        }
        .description {
          font-size: 1.5rem;
        }

        .seeAll {
          font-size: 1.3rem;
        }

        .filterBar {
          margin-top: -2vw; /* bad practice, but used to reduce top margin of button row */
          padding: 0.02vw 0;
          gap: 1vw;
          justify-content: flex-start;
        }

        .filterButton {
          font-size: 1.2rem;
          padding: 0.65rem 1.4rem;
        }

        .settingsIcon {
          margin-top: 0.3vw;
        }

        .rowOfLocations {
          gap: 1.5rem;
          padding-left: 0;
          padding-right: 0;
          max-width: 100%;
          display: flex;
          flex-wrap: nowrap;
          overflow-x: auto;
          scrollbar-width: none;
        }

        .locationBox {
          flex: 0 0 300px; /* used fixed width for boxes on desktop to make them look bigger */
          max-width: 300px;
          min-width: 300px;
        }

        .locationName {
          font-size: 1.55rem;
        }

        .relativePrice,
        .locationDistanceKm {
          font-size: 1.35rem;
        }

        .tag {
          font-size: 1.05rem;
        }
      }

      /* Prevents settings icon clipping on uber small screens */
      @media (max-width: 380px) {
        .filterButton {
          font-size: 3.5vw;
          padding: 0.45rem 0.9rem;
        }

        .settingsIcon {
          width: 7vw;
          max-width: 30px;
          margin-top: 1vw;
        }

        .appName {
          font-size: 8vw;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="header">
        <div class="topBar">
          <div class="fruitsLogo">
            <img src="../img/sillyFruits.png" />
          </div>
          <div>
            <div class="appName">Featured Food Hubs</div>
          </div>
        </div>
      </header>

      <div class="filterBar">
        <button class="filterButton">Free</button>
        <button class="filterButton">Culturally Diverse</button>
        <button class="filterButton">&lt; 5km away</button>

        <img src="../img/settingsIcon.png" class="settingsIcon" />
      </div>

      <section class="newSection">
        <div class="sectionHeader">
          <div>
            <div class="name">Community food pantries</div>
            <div class="description">
              Free, neighbourhood run shelves and fridges.
            </div>
          </div>

          <a href="#" class="seeAll">See all pantries</a>
        </div>

        <div class="rowOfLocations" id="pantriesRow">
        </div>
      </section>

      <!-- Farmers markets -->
      <section class="newSection">
        <div class="sectionHeader">
          <div>
            <div class="name">BC Farmers Markets</div>
            <div class="description">
              Fresh local vendors that accept coupons.
            </div>
          </div>
          <a href="#" class="seeAll">See all markets</a>
        </div>

        <div class="rowOfLocations" id="farmersMarketsRow">
        </div>
      </section>

      <!-- Local Food Markets -->
      <section class="newSection">
        <div class="sectionHeader">
          <div>
            <div class="name">Other Local Food Markets</div>
            <div class="description">Nearby family-owned or local grocers.</div>
          </div>
          <a href="#" class="seeAll">See all markets</a>
        </div>

        <div class="rowOfLocations" id="localFoodMarketsRow">
        </div>
      </section>
    </main>
    <script src="../js/Home.js"></script>
  </body>
</html>
