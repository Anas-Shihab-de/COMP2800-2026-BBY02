<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodHubBC - Map</title>
    <link
      href="https://fonts.googleapis.com/css?family=Darker Grotesque"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        background-color: #a5ffe549;
        margin: 0;
        font-family: "Darker Grotesque";
        display: flex;
        justify-content: center;
        color: #0f2a1f;
      }

      .page {
        width: 100%;
        max-width: 430px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .header {
        padding: 1.5rem 1rem 1rem;
        font-weight: 600;
        color: #0f2a1f;
        background: white;
        text-align: center;
        font-size: 1.5rem;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        letter-spacing: 0.03em;
      }

      .mapBox {
        height: 60vh;
        min-height: 260px;
        background: #d9e8df;
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }

      /* makes deselected map background an opaque white color */
      .mapBox::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        right: 0;
        left: 0;
        background: rgba(255, 255, 255, 0.123);
        pointer-events: none;
      }

      .mapBox iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      .radiusCircle {
        background: rgba(255, 255, 255, 0.185);
        box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.45);
        position: absolute;
        border: 2px solid rgba(0, 80, 50, 0.4);
        top: 50%;
        left: 50%;
        width: 90%;
        height: 70%;
        border-width: 3px;
        aspect-ratio: 1/1; /* keeps circle shape intact */
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none; /* prevents the radius circle from being dragged (controlled by slider instead) */
      }

      .controls {
        animation: boxSlidesIn 0.6s ease-out forwards;
        width: 100%;
        min-height: 33vh;
        display: flex;
        text-align: center;
        flex-direction: column;
        justify-content: flex-start;
        margin-top: -1rem;
        background: rgba(255, 255, 255, 0.075);
        backdrop-filter: blur(13px);
        border-radius: 2rem 2rem 0 0;
        padding: 1.8rem 1.4rem 2.4rem;
        color: #0f2a1f;
      }

      @keyframes boxSlidesIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .controls h2 {
        margin: 0 0 0.8rem;
        font-size: 1.65rem;
        font-weight: 650;
        letter-spacing: 0.03em;
      }

      .sliderSection {
        margin-top: 10px;
        position: relative;
        justify-content: space-between;
        flex-direction: column;
        width: 100%;
        display: flex;
        align-items: center;
        margin-bottom: 0.8rem;
      }

      .sliderValueKm {
        position: absolute;
        right: 0;
        top: -1.4rem;
      }

      .sliderSection span {
        font-size: 1.4rem;
        font-weight: 650;
      }

      .slider {
        transform: scaleY(
          1.3
        ); /* used to make the slider slightly larger (vertically) */
        transform-origin: center;
        width: 100%;
      }

      input[type="range"] {
        margin-top: 10px;
        width: 100%;
        accent-color: #2d5f4a;
        cursor: pointer; /* for desktop only */
      }

      .useLocation {
        justify-content: center;
        align-items: center;
        gap: 0.55rem;
        display: flex;
        margin: 0.5rem 0 1.8rem; /* have to adjust this later, don't want vertical scrolling on certain phone sizes */
        font-size: 1.65rem;
      }

      .useLocation img {
        width: 22px;
        height: 22px;
        object-fit: contain;
      }

      .chooseButton {
        width: 100%;
        font-family: "Darker Grotesque";
        font-size: 1.4rem;
        font-weight: 500;
        margin-top: 0px;
        margin: 0 auto;
        letter-spacing: 0.03em;
        padding: 1rem;
        width: 250px;
        background: #0f2a1f;
        color: white;
        border: none;
        border-radius: 999px;
        transition: 0.4s ease;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }

      .chooseButton:active {
        box-shadow: 0 0 18px rgba(255, 74, 134, 0.507);
        background: #0f2a1f; /* keeps background the same */
        transform: scale(0.98);
      }

      .useLocation:active {
        text-shadow: 0 0 12px rgba(255, 74, 135, 0.75);
        transform: scale(0.97);
      }

      @media (min-width: 700px) {
        .page {
          max-width: 700px;
        }

        .controls {
          max-width: 100%;
        }
      }

      @media (min-width: 1100px) {
        body {
          margin-bottom: 10px;
          background-color: white;
          background: linear-gradient(
            185deg,
            #6fae9854 0%,
            #87dab6b4 28%,
            #8bdaba59 55%,
            #6eb19786 78%,
            #6ab89ec2 100%
          );
        }

        .page {
          margin-top: 2rem;
          border-radius: 1.8rem;
          overflow: hidden;
          max-width: 900px;
          box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .slider {
          width: 800px;
        }

        .chooseButton,
        .useLocation {
          margin-top: -7px; /* terrible practice, but it worked*/
        }

        .controls {
          background-color: #a5ffe500;
          max-width: 100%;
          max-height: 20vh;
        }
      }
    </style>
  </head>

  <body>
    <main class="page">
      <div class="header">Choose a location to see what's available!</div>

      <div class="mapBox">
        <iframe
          id="mapBoxiFrame"
          src="https://maps.google.com/maps?q=Burnaby%20BC&t=&z=13&ie=UTF8&iwloc=&output=embed"
        ></iframe>
        <div class="radiusCircle"></div>
      </div>

      <section class="controls">
        <h2>Select your distance</h2>

        <div class="sliderSection">
          <span class="sliderValueKm">22.5 km</span>
          <div class="slider">
            <input
              id="radiusSlider"
              type="range"
              min="1"
              max="50"
              value="22"
              step="0.5"
            />
          </div>
        </div>

        <div class="useLocation">
          <img src="../img/PlaneIcon.png" />
          <span>Use my current location</span>
        </div>

        <button class="chooseButton">Choose this location</button>
      </section>
    </main>

    <script>
      window.addEventListener("DOMContentLoaded", function () {
        var slider = document.getElementById("radiusSlider");
        var sliderValueKm = document.querySelector(".sliderValueKm");
        var mapFrame = document.getElementById("mapBoxiFrame");

        // the basic url without the zoom
        var startingURL =
          "https://maps.google.com/maps?q=Burnaby%20BC&t=&ie=UTF8&iwloc=&output=embed&z=";

        // sets the initial text for the slider and the initial zoom
        function radiusZoom() {
          var km = parseFloat(slider.value);
          sliderValueKm.textContent = km.toFixed(1) + " km";

          // map zoom: smaller km = closer zoom, larger km = farther out
          // we're assuming the zoom range is about 11–16
          var zoom = 16 - (km / 50) * 5;
          zoom = Math.round(zoom);

          if (zoom < 10) {
            zoom = 10;
          }
          if (zoom > 18) {
            zoom = 18;
          }

          mapFrame.src = startingURL + zoom;
        }

        slider.addEventListener("input", radiusZoom);

        radiusZoom();
      });
    </script>
  </body>
</html>
