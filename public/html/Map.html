<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0"
  />

  <title>FoodHubBC</title>

  <!-- Google Font -->
  <link
          href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@300;400;500;700&display=swap"
          rel="stylesheet"
  />

  <!-- Mapbox -->
  <link
          href="https://api.mapbox.com/mapbox-gl-js/v3.23.1/mapbox-gl.css"
          rel="stylesheet"
  />

  <script
          defer
          src="https://api.mapbox.com/mapbox-gl-js/v3.23.1/mapbox-gl.js"
  ></script>

  <!-- Existing JS -->
  <script
          type="module"
          src="../js/Index_Script.js"
  ></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      display: flex;
      justify-content: center;
      font-family: "Darker Grotesque", sans-serif;
      background: linear-gradient(
        185deg,
        #6fae98 0%,
        #4f7f6a 28%,
        #3b5c4f 55%,
        #2a443a 78%,
        #1e332c 100%
      );
      color: #ffffff;
      min-height: 100vh;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .page {
      width: 100%;
      max-width: 1400px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* HEADER */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .topBar {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .fruitsLogo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
    }

    .fruitsLogo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .appName {
      font-size: 2.8rem;
      font-weight: 700;
      color: white;
    }

    .navBar {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    /* BUTTONS */

    .filterBar {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .filterButton {
      background: rgba(0, 0, 0, 0.75);
      color: white;
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 999px;
      font-size: 1.1rem;
      cursor: pointer;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
      box-shadow:
        0 0 12px rgba(255,255,255,0.25),
        inset 0 0 6px rgba(255,255,255,0.15);
      font-family: inherit;
    }

    .filterButton:hover {
      transform: translateY(-2px);
      box-shadow:
        0 0 18px rgba(255,255,255,0.4),
        0 0 25px rgba(255,120,180,0.35);
    }

    .radiusControl {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      color: white;
      font-size: 1.1rem;
    }

    #radius-slider {
      width: 220px;
    }

    /* MAP */

    .mapSection {
      position: relative;
      width: 100%;
      height: 75vh;
      border-radius: 1.5rem;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.2);
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* INSTRUCTIONS */

    #instructions {
      position: absolute;
      bottom: 1rem;
      left: 1rem;
      width: 320px;
      max-height: 40%;
      overflow-y: auto;
      background: rgba(255,255,255,0.92);
      border-radius: 1rem;
      padding: 1rem;
      z-index: 10;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      color: #10231b;
    }

    /* INFO CARD */

    .info-card {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 320px;
      max-height: 80%;
      overflow-y: auto;
      background: rgba(255,255,255,0.95);
      border-radius: 1rem;
      padding: 1rem;
      z-index: 10;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      color: #10231b;
    }

    .hidden {
      display: none;
    }

    #status {
      color: white;
      font-size: 1rem;
    }

    /* MOBILE */

    @media (max-width: 768px) {
      .appName {
        font-size: 2rem;
      }

      .mapSection {
        height: 65vh;
      }

      #instructions,
      .info-card {
        width: calc(100% - 2rem);
        left: 1rem;
        right: 1rem;
      }

      .info-card {
        top: auto;
        bottom: 1rem;
      }
    }
    #map {
  position: relative;
  z-index: 1;
}

#map-overlay {
  position: absolute;
  inset: 0;
  background: rgba(255, 0, 0, 0.35);
  pointer-events: none;
  z-index: 2;

  /* SHARP hole in center */
  -webkit-mask-image: radial-gradient(
    circle 80px at center,
    transparent 0 80px,
    black 80px 100%
  );

  mask-image: radial-gradient(
    circle 80px at center,
    transparent 0 80px,
    black 80px 100%
  );

  -webkit-mask-repeat: no-repeat;
  mask-repeat: no-repeat;
}

  </style>
</head>

<body>

<main class="page">

  <!-- HEADER -->
  <header class="header">

    <div class="topBar">

      <div class="fruitsLogo">
        <img
                src="../img/sillyFruits.png"
                alt="FoodHubBC logo"
        />
      </div>

      <div class="appName">
        FoodHubBC
      </div>

    </div>

    <nav class="navBar">

      <a
              href="./settings.html"
              class="filterButton"
      >
        Settings
      </a>

      <a
              href="./instructions.html"
              class="filterButton"
      >
        Instructions
      </a>

      <a
              href="./Login.html"
              class="filterButton"
      >
        Log In
      </a>

    </nav>

  </header>

  <!-- CONTROLS -->
  <section class="filterBar">

    <button
            id="set-location-btn"
            class="filterButton"
            type="button"
    >
      Set Selected Location
    </button>

    <button
            id="use-current-location-btn"
            class="filterButton"
            type="button"
    >
      Use Current Location
    </button>

    <div class="radiusControl">

      <label for="radius-slider">
        Distance Radius:
        <span id="radius-value">5</span> km
      </label>

      <input
              id="radius-slider"
              type="range"
              min="1"
              max="50"
              value="5"
      />

    </div>

  </section>

  <!-- MAP -->

  <section class="mapSection">

    <div id="map"></div>
    <div id="map-overlay"></div>
    <div id="instructions"></div>

    <p id="status"></p>

    <div
            id="info-card"
            class="info-card hidden"
    ></div>

  </section>

</main>



</body>
</html>
