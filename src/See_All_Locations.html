<head>

  <title>See All</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_back_ios,bookmark_heart,filter_list" />
  <!-- CSS -->
  <link rel="stylesheet" href="See_All_Locations.css">

<body>

  <!-- HEADER -->
  <header class="header">

    <h1 class="header-title" id="page-title"></h1>

    <div class="header-actions">
      <button class="saved-btn" id="saved-btn">Saved Places</button>

      <button class="filter-btn" id="filter-btn">
        <span class="material-symbols-outlined">filter_list</span>
      </button>
    </div>

  </header>

  <main class="cards-grid" id="cards-grid">

    <!-- Placeholder to show location cards, will eventually replace this html block with JavaScript, mainly just testing responsive grid-->

      <div class="card">

          <button class="bookmark-btn">
            <span class="material-symbols-outlined">bookmark_heart</span>
          </button>
        </div>

        <div class="card-body">
          <p class="card-name">Location Name</p>
          <div class="card-meta">
            <span class="meta-distance">X km</span>
            <span class="meta-price">$$</span>
          </div>
          <div class="card-tags">
